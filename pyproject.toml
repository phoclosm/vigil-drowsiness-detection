[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-drowsiness"
version = "0.1.0"
description = "A learning-focused driver drowsiness detection prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
desktop = [
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "opencv-contrib-python==4.11.0.86",
]
opencv5 = [
    "opencv-python==5.0.0.93",
    "numpy>=2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
ml = [
    "torch>=2.2",
]

[project.scripts]
vigil = "vigil.__main__:main"
vigil-benchmark = "vigil.benchmark:main"

[project.urls]
Repository = "https://github.com/phoclosm/vigil-drowsiness-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
