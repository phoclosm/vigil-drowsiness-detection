[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-drowsiness"
version = "0.1.0"
description = "A learning-focused driver drowsiness detection prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
ml = [
    "torch>=2.2",
]

[project.scripts]
vigil = "vigil.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
