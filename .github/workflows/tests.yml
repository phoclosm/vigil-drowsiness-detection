name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        environment: [desktop, opencv5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.environment }},dev,ml]"
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m compileall -q src
      - name: Verify real vision backend
        if: matrix.environment == 'desktop'
        run: python -c "from vigil.runtime.landmarks import MediaPipeFaceLandmarkDetector; detector = MediaPipeFaceLandmarkDetector(); detector.close()"
      - name: Verify OpenCV 5 version
        if: matrix.environment == 'opencv5'
        run: python -c "import cv2; assert cv2.__version__ == '5.0.0', cv2.__version__"
