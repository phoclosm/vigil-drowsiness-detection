name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        environment: [desktop, legacy, cloud]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.environment }},cloud,client,dev,ml]"
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m compileall -q src
      - name: Verify real Tasks backend
        if: matrix.environment == 'desktop'
        run: |
          mkdir -p artifacts/vision
          curl --fail --location --retry 2 https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task -o artifacts/vision/face_landmarker.task
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  artifacts/vision/face_landmarker.task' | sha256sum --check
          python -c "import cv2; assert cv2.__version__ == '5.0.0'"
          python scripts/vision_smoke.py --model artifacts/vision/face_landmarker.task
      - name: Verify legacy backend
        if: matrix.environment == 'legacy'
        run: |
          python - <<'PY'
          import numpy as np
          from vigil.runtime.landmarks import MediaPipeFaceLandmarkDetector
          with MediaPipeFaceLandmarkDetector() as detector:
              assert detector.detect(np.zeros((100, 100, 3), dtype=np.uint8)) == ()
          PY
      - name: Verify cloud has no vision packages
        if: matrix.environment == 'cloud'
        run: python -c "import importlib.util; assert importlib.util.find_spec('cv2') is None; assert importlib.util.find_spec('mediapipe') is None"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vigil-cloud:ci .
      - name: Synthetic bundle and container smoke
        run: |
          mkdir -p artifacts
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/artifacts:/fixtures" -v "$PWD/scripts:/scripts:ro" vigil-cloud:ci python /scripts/cloud_smoke.py --create-fixture /fixtures/untrained.pt
          docker run -d --name vigil-cloud-ci -p 8080:8080 -v "$PWD/artifacts:/models:ro" -e VIGIL_BUNDLE_PATH=/models/untrained.pt vigil-cloud:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          docker exec vigil-cloud-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
          docker run --rm --network host -v "$PWD/scripts:/scripts:ro" vigil-cloud:ci python /scripts/cloud_smoke.py --url http://127.0.0.1:8080
      - if: always()
        run: docker rm -f vigil-cloud-ci || true
